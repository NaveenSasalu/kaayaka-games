<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost in the Forest - A Survival Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: #0a0f0a;
            color: #e8e4d9;
        }

        /* Main Layout */
        .game-wrapper {
            display: flex;
            height: 100vh;
        }

        /* Forest Scene */
        .scene-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .forest-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transition: all 2s ease;
        }

        /* Sky layers */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            transition: background 3s ease;
        }

        .sky.morning {
            background: linear-gradient(180deg, #87CEEB 0%, #FFE4B5 50%, #FFA07A 100%);
        }

        .sky.day {
            background: linear-gradient(180deg, #4A90D9 0%, #87CEEB 50%, #B0E0E6 100%);
        }

        .sky.evening {
            background: linear-gradient(180deg, #2C1810 0%, #8B4513 30%, #FF6347 60%, #FFD700 100%);
        }

        .sky.night {
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 50%, #2a2a4a 100%);
        }

        /* Stars */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .stars.visible {
            opacity: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Sun/Moon */
        .celestial {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            transition: all 3s ease;
        }

        .sun {
            background: radial-gradient(circle, #FFD700 0%, #FFA500 100%);
            box-shadow: 0 0 60px rgba(255, 200, 0, 0.6);
        }

        .moon {
            background: radial-gradient(circle at 30% 30%, #f5f5dc 0%, #d4d4aa 100%);
            box-shadow: 0 0 40px rgba(255, 255, 200, 0.3);
        }

        /* Ground and forest */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(180deg, #1a3a1a 0%, #0f280f 50%, #0a1a0a 100%);
        }

        /* Trees */
        .trees-back {
            position: absolute;
            bottom: 40%;
            left: 0;
            right: 0;
            height: 35%;
            display: flex;
            justify-content: space-around;
            opacity: 0.4;
        }

        .trees-mid {
            position: absolute;
            bottom: 30%;
            left: 0;
            right: 0;
            height: 45%;
            display: flex;
            justify-content: space-around;
            opacity: 0.6;
        }

        .trees-front {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            display: flex;
            justify-content: space-around;
            opacity: 0.9;
        }

        .tree {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tree-top {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 80px solid #0f3010;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .tree-top-2 {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 60px solid #1a4520;
            margin-top: -30px;
        }

        .tree-trunk {
            width: 12px;
            height: 40px;
            background: linear-gradient(90deg, #3d2817 0%, #5c3d2e 50%, #3d2817 100%);
            margin-top: -5px;
        }

        .trees-front .tree-top {
            border-left-width: 50px;
            border-right-width: 50px;
            border-bottom-width: 120px;
            border-bottom-color: #0a2510;
        }

        .trees-front .tree-top-2 {
            border-left-width: 40px;
            border-right-width: 40px;
            border-bottom-width: 90px;
            border-bottom-color: #153520;
            margin-top: -50px;
        }

        .trees-front .tree-trunk {
            width: 20px;
            height: 60px;
        }

        /* Fog */
        .fog {
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(180deg, transparent 0%, rgba(200,200,200,0.1) 50%, transparent 100%);
            animation: fogMove 20s ease-in-out infinite;
        }

        @keyframes fogMove {
            0%, 100% { transform: translateX(-5%); opacity: 0.3; }
            50% { transform: translateX(5%); opacity: 0.5; }
        }

        /* Fireflies */
        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffff88;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255, 255, 100, 0.8);
            animation: fireflyFloat 8s ease-in-out infinite;
            opacity: 0;
        }

        .firefly.visible {
            opacity: 1;
        }

        @keyframes fireflyFloat {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -20px); }
            50% { transform: translate(-20px, -40px); }
            75% { transform: translate(10px, -10px); }
        }

        /* Campfire */
        .campfire {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        .campfire.visible {
            display: block;
        }

        .fire {
            width: 40px;
            height: 60px;
            position: relative;
        }

        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
            background: linear-gradient(180deg, #ff6600 0%, #ffcc00 50%, #fff 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.5s ease-in-out infinite alternate;
            box-shadow: 0 0 30px rgba(255, 150, 0, 0.8), 0 0 60px rgba(255, 100, 0, 0.5);
        }

        .flame:nth-child(2) {
            width: 15px;
            height: 30px;
            left: 30%;
            animation-delay: 0.1s;
        }

        .flame:nth-child(3) {
            width: 12px;
            height: 25px;
            left: 70%;
            animation-delay: 0.2s;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
        }

        .logs {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }

        .log {
            width: 40px;
            height: 10px;
            background: linear-gradient(90deg, #3d2817, #5c3d2e, #3d2817);
            border-radius: 3px;
        }

        .log:nth-child(2) {
            transform: rotate(60deg) translate(-5px, -15px);
        }

        /* Shelter */
        .shelter {
            position: absolute;
            bottom: 25%;
            right: 20%;
            display: none;
        }

        .shelter.visible {
            display: block;
        }

        .shelter-frame {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 80px solid #2d1f14;
            position: relative;
        }

        .shelter-opening {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 35px;
            background: #0a0a0a;
            border-radius: 50% 50% 0 0;
        }

        /* Weather effects */
        .rain {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: none;
        }

        .rain.visible {
            display: block;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(180deg, transparent, rgba(174, 194, 224, 0.6));
            animation: rain 0.8s linear infinite;
        }

        @keyframes rain {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        /* Scene overlay for time of day */
        .scene-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            transition: background 3s ease;
        }

        .scene-overlay.night {
            background: rgba(0, 0, 30, 0.5);
        }

        .scene-overlay.evening {
            background: rgba(50, 20, 0, 0.2);
        }

        /* Game Panel */
        .game-panel {
            width: 420px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1510 0%, #0f0a05 100%);
            border-left: 3px solid #3d2817;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Day counter */
        .day-header {
            background: linear-gradient(90deg, #2d1f14 0%, #1a1208 100%);
            padding: 15px 20px;
            border-bottom: 2px solid #3d2817;
            text-align: center;
        }

        .day-number {
            font-family: 'Crimson Text', serif;
            font-size: 1.8rem;
            color: #d4a056;
            text-shadow: 0 0 10px rgba(212, 160, 86, 0.3);
        }

        .time-display {
            font-size: 0.85rem;
            color: #8a7a5a;
            margin-top: 5px;
        }

        /* Status bars */
        .status-section {
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #2d1f14;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .status-label {
            font-size: 0.7rem;
            color: #8a7a5a;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar {
            height: 8px;
            background: #1a1510;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #3d2817;
        }

        .status-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease, background 0.5s ease;
        }

        .status-fill.health { background: linear-gradient(90deg, #cc4444, #44cc44); }
        .status-fill.hunger { background: linear-gradient(90deg, #cc8844, #44aa44); }
        .status-fill.thirst { background: linear-gradient(90deg, #4488cc, #44aacc); }
        .status-fill.warmth { background: linear-gradient(90deg, #cc6644, #ccaa44); }
        .status-fill.energy { background: linear-gradient(90deg, #8844cc, #44cc88); }
        .status-fill.morale { background: linear-gradient(90deg, #cc4488, #cccc44); }

        .status-value {
            font-size: 0.7rem;
            color: #a0906a;
            text-align: right;
            margin-top: 2px;
        }

        /* Inventory */
        .inventory-section {
            padding: 15px 20px;
            border-bottom: 1px solid #2d1f14;
        }

        .section-title {
            font-family: 'Crimson Text', serif;
            font-size: 1rem;
            color: #d4a056;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .inv-item {
            background: linear-gradient(135deg, #2d1f14 0%, #1a1208 100%);
            border: 1px solid #3d2817;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75rem;
            color: #c0b090;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .inv-empty {
            color: #5a4a3a;
            font-style: italic;
            font-size: 0.8rem;
        }

        /* Story area */
        .story-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
        }

        .story-text {
            font-family: 'Crimson Text', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #d8d0c0;
        }

        .story-text p {
            margin-bottom: 15px;
            text-indent: 20px;
        }

        .story-text p:first-child {
            text-indent: 0;
        }

        .story-text .highlight {
            color: #d4a056;
            font-weight: 600;
        }

        .story-text .nature {
            color: #7cb07c;
            font-style: italic;
        }

        .story-text .warning {
            color: #cc8844;
        }

        .story-text .discovery {
            color: #88aacc;
        }

        /* Choices */
        .choices-section {
            padding: 15px 20px;
            background: linear-gradient(180deg, #1a1510 0%, #0f0a05 100%);
            border-top: 2px solid #3d2817;
        }

        .choice-btn {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #2d1f14 0%, #1a1208 100%);
            border: 1px solid #3d2817;
            border-radius: 6px;
            color: #c0b090;
            font-family: 'Raleway', sans-serif;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #3d2f24 0%, #2a1a10 100%);
            border-color: #d4a056;
            color: #d4a056;
            transform: translateX(5px);
        }

        .choice-btn:last-child {
            margin-bottom: 0;
        }

        .choice-icon {
            font-size: 1.2rem;
            width: 30px;
            text-align: center;
        }

        .choice-text {
            flex: 1;
        }

        .choice-cost {
            font-size: 0.7rem;
            color: #8a6a4a;
        }

        /* Knowledge gained */
        .knowledge-popup {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #1a3020 0%, #0f2015 100%);
            border: 2px solid #2a5030;
            border-radius: 10px;
            padding: 15px 20px;
            max-width: 350px;
            transform: translateY(150%);
            transition: transform 0.5s ease;
            z-index: 100;
        }

        .knowledge-popup.show {
            transform: translateY(0);
        }

        .knowledge-title {
            color: #7cb07c;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .knowledge-text {
            font-size: 0.85rem;
            color: #a0c0a0;
            line-height: 1.5;
        }

        /* Sound toggle */
        .sound-toggle {
            position: fixed;
            top: 15px;
            right: 440px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #3d2817;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            z-index: 50;
        }

        .sound-toggle:hover {
            background: rgba(60,40,20,0.8);
        }

        /* Victory overlay */
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .victory-overlay.show {
            display: flex;
        }

        .victory-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .victory-title {
            font-family: 'Crimson Text', serif;
            font-size: 2.5rem;
            color: #d4a056;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 160, 86, 0.5);
        }

        .victory-text {
            font-size: 1.1rem;
            color: #c0b090;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .victory-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .victory-stat {
            background: rgba(45, 31, 20, 0.5);
            border: 1px solid #3d2817;
            border-radius: 10px;
            padding: 15px;
        }

        .victory-stat-value {
            font-size: 2rem;
            color: #d4a056;
            font-weight: 700;
        }

        .victory-stat-label {
            font-size: 0.75rem;
            color: #8a7a5a;
            text-transform: uppercase;
        }

        .restart-btn {
            background: linear-gradient(135deg, #3d5030 0%, #2a3520 100%);
            border: 2px solid #5a7048;
            color: #b0c0a0;
            padding: 15px 40px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #4d6040 0%, #3a4530 100%);
            transform: scale(1.05);
        }

        /* Scrollbar */
        .story-section::-webkit-scrollbar {
            width: 8px;
        }

        .story-section::-webkit-scrollbar-track {
            background: #1a1510;
        }

        .story-section::-webkit-scrollbar-thumb {
            background: #3d2817;
            border-radius: 4px;
        }

        /* Back Button + Branding */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        .kaayaka-back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 8px 16px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .kaayaka-back-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .kaayaka-branding {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
        }
        .kaayaka-branding a {
            color: rgba(255,255,255,0.35);
            text-decoration: none;
            transition: color 0.3s;
        }
        .kaayaka-branding a:hover { color: rgba(255,255,255,0.6); }

        /* Responsive */
        @media (max-width: 900px) {
            .game-wrapper {
                flex-direction: column;
            }

            .scene-container {
                height: 40vh;
            }

            .game-panel {
                width: 100%;
                height: 60vh;
            }

            .sound-toggle {
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="kaayaka-back-btn">← Games</a>
    <div class="kaayaka-branding"><a href="https://kaayaka.in">Kaayaka Games</a></div>
    <div class="game-wrapper">
        <!-- Forest Scene -->
        <div class="scene-container">
            <div class="forest-scene">
                <!-- Sky -->
                <div class="sky morning" id="sky"></div>

                <!-- Stars (for night) -->
                <div class="stars" id="stars"></div>

                <!-- Sun/Moon -->
                <div class="celestial sun" id="celestial" style="top: 20%; left: 30%;"></div>

                <!-- Ground -->
                <div class="ground"></div>

                <!-- Trees layers -->
                <div class="trees-back" id="treesBack"></div>
                <div class="trees-mid" id="treesMid"></div>
                <div class="trees-front" id="treesFront"></div>

                <!-- Fog -->
                <div class="fog"></div>

                <!-- Fireflies -->
                <div id="fireflies"></div>

                <!-- Campfire -->
                <div class="campfire" id="campfire">
                    <div class="fire">
                        <div class="flame"></div>
                        <div class="flame"></div>
                        <div class="flame"></div>
                    </div>
                    <div class="logs">
                        <div class="log"></div>
                        <div class="log"></div>
                    </div>
                </div>

                <!-- Shelter -->
                <div class="shelter" id="shelter">
                    <div class="shelter-frame">
                        <div class="shelter-opening"></div>
                    </div>
                </div>

                <!-- Rain -->
                <div class="rain" id="rain"></div>

                <!-- Overlay -->
                <div class="scene-overlay" id="sceneOverlay"></div>
            </div>
        </div>

        <!-- Game Panel -->
        <div class="game-panel">
            <!-- Day Header -->
            <div class="day-header">
                <div class="day-number" id="dayNumber">Day 1</div>
                <div class="time-display" id="timeDisplay">Early Morning • Clear Sky</div>
            </div>

            <!-- Status Bars -->
            <div class="status-section">
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">❤️ Health</div>
                        <div class="status-bar"><div class="status-fill health" id="healthBar" style="width: 100%"></div></div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">🍖 Hunger</div>
                        <div class="status-bar"><div class="status-fill hunger" id="hungerBar" style="width: 80%"></div></div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">💧 Thirst</div>
                        <div class="status-bar"><div class="status-fill thirst" id="thirstBar" style="width: 80%"></div></div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">🔥 Warmth</div>
                        <div class="status-bar"><div class="status-fill warmth" id="warmthBar" style="width: 70%"></div></div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">⚡ Energy</div>
                        <div class="status-bar"><div class="status-fill energy" id="energyBar" style="width: 90%"></div></div>
                    </div>
                    <div class="status-item">

        let audioCtx = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!game.soundEnabled || !audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.frequency.value = 523;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                setTimeout(() => osc.frequency.value = 659, 100);
                setTimeout(() => osc.frequency.value = 784, 200);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'discovery') {
                osc.type = 'triangle';
                osc.frequency.value = 440;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // ========== RENDERING ==========
        function createTrees() {
            ['treesBack', 'treesMid', 'treesFront'].forEach((id, layerIdx) => {
                const container = document.getElementById(id);
                const count = layerIdx === 2 ? 6 : 8;
                for (let i = 0; i < count; i++) {
                    const tree = document.createElement('div');
                    tree.className = 'tree';
                    tree.innerHTML = `
                        <div class="tree-top"></div>
                        <div class="tree-top-2"></div>
                        <div class="tree-trunk"></div>
                    `;
                    tree.style.transform = `translateX(${(Math.random() - 0.5) * 30}px)`;
                    container.appendChild(tree);
                }
            });
        }

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        function createFireflies() {
            const container = document.getElementById('fireflies');
            for (let i = 0; i < 15; i++) {
                const firefly = document.createElement('div');
                firefly.className = 'firefly';
                firefly.style.left = (20 + Math.random() * 60) + '%';
                firefly.style.top = (40 + Math.random() * 40) + '%';
                firefly.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(firefly);

            const container = document.getElementById('rain');
            for (let i = 0; i < 100; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.animationDelay = Math.random() * 1 + 's';
                container.appendChild(drop);

        function updateScene() {
            const sky = document.getElementById('sky');
            const stars = document.getElementById('stars');
            const celestial = document.getElementById('celestial');
            const overlay = document.getElementById('sceneOverlay');
            const fireflies = document.querySelectorAll('.firefly');

            // Update sky
            sky.className = 'sky ' + ['morning', 'day', 'evening', 'night'][game.timeOfDay];

            // Update stars
            stars.classList.toggle('visible', game.timeOfDay === 3);

            // Update sun/moon
            celestial.className = 'celestial ' + (game.timeOfDay === 3 ? 'moon' : 'sun');
            const positions = [
                { top: '25%', left: '25%' },
                { top: '15%', left: '50%' },
                { top: '30%', left: '70%' },
                { top: '20%', left: '60%' }
            ];
            celestial.style.top = positions[game.timeOfDay].top;
            celestial.style.left = positions[game.timeOfDay].left;

            // Update overlay
            overlay.className = 'scene-overlay ' + ['', '', 'evening', 'night'][game.timeOfDay];

            // Update fireflies
            fireflies.forEach(f => f.classList.toggle('visible', game.timeOfDay >= 2));

            // Update campfire and shelter
            document.getElementById('campfire').classList.toggle('visible', game.hasFire);
            document.getElementById('shelter').classList.toggle('visible', game.hasShelter);

            // Update rain
            document.getElementById('rain').classList.toggle('visible', game.weather === 'rain' || game.weather === 'storm');
        }

        function updateUI() {
            // Day and time
            document.getElementById('dayNumber').textContent = `Day ${game.day}`;
            document.getElementById('timeDisplay').textContent = `${timeNames[game.timeOfDay]} • ${weatherNames[game.weather]}`;

            // Status bars
            document.getElementById('healthBar').style.width = game.health + '%';
            document.getElementById('hungerBar').style.width = game.hunger + '%';
            document.getElementById('thirstBar').style.width = game.thirst + '%';
            document.getElementById('warmthBar').style.width = game.warmth + '%';
            document.getElementById('energyBar').style.width = game.energy + '%';
            document.getElementById('moraleBar').style.width = game.morale + '%';

            // Inventory
            const invEl = document.getElementById('inventory');
            if (game.inventory.length === 0) {
                invEl.innerHTML = '<span class="inv-empty">Your pockets are empty...</span>';
            } else {
                invEl.innerHTML = game.inventory.map(item =>
                    `<div class="inv-item">${item.icon} ${item.name}</div>`
                ).join('');
            }

            updateScene();
        }

        function renderScene(sceneId) {
            const scene = scenes[sceneId];

            if (scene.isVictory) {
                showVictory();
                return;
            }

            // Apply stat changes (Walking Stick reduces energy costs)
            if (scene.statChanges) {
                const hasStick = game.inventory.find(i => i.name === 'Walking Stick');
                for (let stat in scene.statChanges) {
                    let change = scene.statChanges[stat];
                    if (stat === 'energy' && change < 0 && hasStick) {
                        change = Math.round(change * 0.6); // 40% less energy cost
                    }
                    game[stat] = Math.max(0, Math.min(100, game[stat] + change));
                }
            }

            // Add items
            if (scene.addItem && !game.inventory.find(i => i.name === scene.addItem.name)) {
                game.inventory.push(scene.addItem);
            }
            if (scene.addItem2 && !game.inventory.find(i => i.name === scene.addItem2.name)) {
                game.inventory.push(scene.addItem2);
            }
            if (scene.addItem3 && !game.inventory.find(i => i.name === scene.addItem3.name)) {
                game.inventory.push(scene.addItem3);
            }

            // Remove items
            if (scene.removeItem) {
                game.inventory = game.inventory.filter(i => i.name !== scene.removeItem);
            }

            // Set fire flag
            if (scene.setFire) {
                game.hasFire = true;
            }

            // Add skill
            if (scene.knowledge && !game.skills.includes(scene.knowledge)) {
                game.skills.push(scene.knowledge);
            }

            // Update UI
            updateUI();

            // Render story
            document.getElementById('storyText').innerHTML = scene.text;

            // Render choices
            const choicesEl = document.getElementById('choicesSection');
            choicesEl.innerHTML = scene.choices.map(choice => `
                <button class="choice-btn" onclick="makeChoice('${choice.next}')">
                    <span class="choice-icon">${choice.icon}</span>
                    <div class="choice-text">${choice.text}</div>
                    ${choice.cost ? `<span class="choice-cost">${choice.cost}</span>` : ''}
                </button>
            `).join('');

            // Show knowledge popup
            if (scene.knowledge) {
                setTimeout(() => showKnowledge(scene.knowledge), 1000);
            }

            // Scroll story to top
            document.getElementById('storySection').scrollTop = 0;
        }

        // ========== RANDOM EVENTS ==========

        function triggerRandomEvent() {
            const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
            // Apply stat changes
            if (event.statChanges) {
                for (let stat in event.statChanges) {
                    game[stat] = Math.max(0, Math.min(100, game[stat] + event.statChanges[stat]));
                }
            }
            if (event.triggerRain) {
                game.weather = 'rain';
            }
            updateUI();
            showKnowledge(`Random event: ${event.name}`);
            return event.text;
        }

        function makeChoice(nextScene) {
            if (!audioCtx) initAudio();
            playSound('click');

            // Track scene visit
            trackSceneVisit(nextScene);

            game.actionsToday++;

            // Time advances every few actions
            if (game.actionsToday >= 3) {
                game.actionsToday = 0;
                advanceTime();
            }

            // Branching: eatBerries has 15% chance of wrong berries
            if (nextScene === 'eatBerries' && Math.random() < 0.15) {
                game.scene = 'eatBerries';
                renderScene('eatBerries');
                // Override with bad berries aftermath
                setTimeout(() => {
                    game.health = Math.max(0, game.health - 30);
                    game.morale = Math.max(0, game.morale - 20);
                    updateUI();
                    showKnowledge('Those berries were wrong! Always be 100% sure before eating wild plants.');
                    document.getElementById('storyText').innerHTML += `
                        <p><span class="warning">Wait... your stomach lurches. These aren't blueberries! You feel nauseous and dizzy.</span></p>
                        <p>The sick feeling passes slowly, but it was a harsh lesson.</p>`;
                }, 500);
                return;
            }

            // Check if choice has requirements
            const currentScene = scenes[game.scene];
            if (currentScene && currentScene.choices) {
                const choice = currentScene.choices.find(c => c.next === nextScene);
                if (choice) {
                    if (choice.requires) {
                        const missing = choice.requires.filter(req => !game.inventory.find(i => i.name === req));
                        if (missing.length > 0) {
                            showKnowledge(`You need: ${missing.join(', ')}`);
                            return;
                        }
                    }
                    if (choice.requiresAny) {
                        const hasAny = choice.requiresAny.some(req => game.inventory.find(i => i.name === req));
                        if (!hasAny) {
                            showKnowledge(`You need one of: ${choice.requiresAny.join(' or ')}`);
                            return;
                        }
                    }
                }
            }

            // 20% chance of random event (not on victory or intro)
            let eventText = '';
            if (nextScene !== 'victory' && !nextScene.startsWith('victory') && nextScene !== 'intro' && Math.random() < 0.2) {
                eventText = triggerRandomEvent();
            }

            game.scene = nextScene;
            renderScene(nextScene);

            // Prepend random event text if it occurred
            if (eventText) {
                const storyEl = document.getElementById('storyText');
                storyEl.innerHTML = eventText + '<hr style="border-color:#3d2817;margin:15px 0">' + storyEl.innerHTML;
            }
        }

        function advanceTime() {
            game.timeOfDay++;
            if (game.timeOfDay > 3) {
                game.timeOfDay = 0;
                game.day++;
                game.totalDays++;

                // Night penalties
                game.warmth = Math.max(0, game.warmth - 15);
                game.energy = Math.max(0, game.energy - 10);
            }

            // Random weather changes
            if (Math.random() < 0.2) {
                const weathers = ['clear', 'clear', 'cloudy', 'rain'];
                game.weather = weathers[Math.floor(Math.random() * weathers.length)];
            }
        }

        function showKnowledge(text) {
            const popup = document.getElementById('knowledgePopup');
            document.getElementById('knowledgeText').textContent = text;
            popup.classList.add('show');
            playSound('discovery');

            setTimeout(() => popup.classList.remove('show'), 5000);
        }

        function showVictory() {
            playSound('success');

            // Get the current scene's victory details
            const currentVictoryScene = scenes[game.scene];
            const endingId = (currentVictoryScene && currentVictoryScene.endingId) || 'default';
            const title = (currentVictoryScene && currentVictoryScene.victoryTitle) || '🏠 You Made It Home!';
            const text = (currentVictoryScene && currentVictoryScene.victoryText) || `
                <p>You burst through the treeline and there it is — Camp Pinecone!</p>
                <p>You're safe. You made it home.</p>`;

            // Track this ending
            trackEndingFound(endingId);
            trackSceneVisit(game.scene);

            const replayData = getReplayData();
            const endingsCount = replayData.endingsFound.length;
            const scenesCount = replayData.scenesVisited.length;

            document.querySelector('.victory-title').textContent = title;
            document.getElementById('victoryText').innerHTML = text;

            const statsEl = document.getElementById('victoryStats');
            statsEl.innerHTML = `
                <div class="victory-stat">
                    <div class="victory-stat-value">${game.totalDays}</div>
                    <div class="victory-stat-label">Day${game.totalDays > 1 ? 's' : ''} Survived</div>
                </div>
                <div class="victory-stat">
                    <div class="victory-stat-value">${game.inventory.length}</div>
                    <div class="victory-stat-label">Items Found</div>
                </div>
                <div class="victory-stat">
                    <div class="victory-stat-value">${game.skills.length}</div>
                    <div class="victory-stat-label">Skills Learned</div>
                </div>
                <div class="victory-stat">
                    <div class="victory-stat-value">${endingsCount}/${TOTAL_ENDINGS}</div>
                    <div class="victory-stat-label">Endings Found</div>
                </div>
                <div class="victory-stat">
                    <div class="victory-stat-value">${scenesCount}/${ALL_SCENE_IDS.length}</div>
                    <div class="victory-stat-label">Paths Explored</div>
                </div>
            `;

            document.getElementById('victoryOverlay').classList.add('show');
            clearForestSave();
        }

        function restartGame() {
            clearForestSave();
            game.day = 1;
            game.timeOfDay = 0;
            game.weather = 'clear';
            game.health = 100;
            game.hunger = 80;
            game.thirst = 80;
            game.warmth = 70;
            game.energy = 90;
            game.morale = 75;
            game.inventory = [];
            game.skills = [];
            game.hasShelter = false;
            game.hasFire = false;
            game.scene = 'intro';
            game.actionsToday = 0;
            game.totalDays = 1;

            document.getElementById('victoryOverlay').classList.remove('show');
            updateUI();
            renderScene('intro');
        }

        // ========== REPLAY TRACKING ==========
        const FOREST_REPLAY_KEY = 'kaayaka_forest_replay_v1';
        const TOTAL_ENDINGS = 5;

        function getReplayData() {
            try {
                const raw = localStorage.getItem(FOREST_REPLAY_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return { endingsFound: [], scenesVisited: [] };
        }

        function saveReplayData(data) {
            try { localStorage.setItem(FOREST_REPLAY_KEY, JSON.stringify(data)); } catch(e) {}
        }

        function trackSceneVisit(sceneId) {
            const data = getReplayData();
            if (!data.scenesVisited.includes(sceneId)) {
                data.scenesVisited.push(sceneId);
                saveReplayData(data);
            }
        }

        function trackEndingFound(endingId) {
            if (!endingId) return;
            const data = getReplayData();
            if (!data.endingsFound.includes(endingId)) {
                data.endingsFound.push(endingId);
                saveReplayData(data);
            }
        }

        const ALL_SCENE_IDS = Object.keys(scenes).filter(k => !scenes[k].isVictory);

        const FOREST_SAVE_KEY = 'kaayaka_forest_v1';

        function saveForestState() {
            const data = {
                scene: game.scene, day: game.day, timeOfDay: game.timeOfDay,
                weather: game.weather, health: game.health, hunger: game.hunger,
                thirst: game.thirst, warmth: game.warmth, energy: game.energy,
                morale: game.morale, inventory: game.inventory, skills: game.skills,
                hasShelter: game.hasShelter, hasFire: game.hasFire,
                actionsToday: game.actionsToday, totalDays: game.totalDays
            };
            try { localStorage.setItem(FOREST_SAVE_KEY, JSON.stringify(data)); } catch(e) {}
        }

        function loadForestState() {
            try {
                const raw = localStorage.getItem(FOREST_SAVE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch(e) { return null; }
        }

        function clearForestSave() {
            try { localStorage.removeItem(FOREST_SAVE_KEY); } catch(e) {}
        }

        function showContinueScreen(savedData) {
            document.getElementById('storyText').innerHTML = `
                <p><span class="highlight">Welcome back, adventurer.</span></p>
                <p>You have a saved game from Day ${savedData.day} (${timeNames[savedData.timeOfDay]}).</p>
                <p>You had ${savedData.inventory.length} item${savedData.inventory.length !== 1 ? 's' : ''} and ${savedData.skills.length} skill${savedData.skills.length !== 1 ? 's' : ''}.</p>`;
            document.getElementById('choicesSection').innerHTML = `
                <button class="choice-btn" onclick="resumeSavedGame()">
                    <span class="choice-icon">📖</span>
                    <div class="choice-text">Continue Adventure</div>
                </button>
                <button class="choice-btn" onclick="startNewGame()">
                    <span class="choice-icon">🌲</span>
                    <div class="choice-text">New Game</div>
                </button>`;
        }

        function resumeSavedGame() {
            const saved = loadForestState();
            if (!saved) { startNewGame(); return; }
            Object.assign(game, saved);
            updateUI();
            renderScene(game.scene);
        }

        function startNewGame() {
            clearForestSave();
            game.day = 1; game.timeOfDay = 0; game.weather = 'clear';
            game.health = 100; game.hunger = 80; game.thirst = 80;
            game.warmth = 70; game.energy = 90; game.morale = 75;
            game.inventory = []; game.skills = [];
            game.hasShelter = false; game.hasFire = false;
            game.scene = 'intro'; game.actionsToday = 0; game.totalDays = 1;
            updateUI();
            renderScene('intro');
        }

        // Patch makeChoice to auto-save
        const _originalMakeChoice = makeChoice;
        makeChoice = function(nextScene) {
            _originalMakeChoice(nextScene);
            if (nextScene !== 'victory') saveForestState();
            else clearForestSave();
        };

        // ========== INITIALIZATION ==========
        createTrees();
        createStars();
        createFireflies();
        createRain();
        updateUI();

        const savedForest = loadForestState();
        if (savedForest && savedForest.scene !== 'intro') {
            showContinueScreen(savedForest);
        } else {
            renderScene('intro');
        }
    </script>
</body>
</html>
