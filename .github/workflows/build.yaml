name: Build & Push Kaayaka Games + Update K8s Manifests

on:
  push:
    branches: ["main"]
    paths:
      - "**.html"
      - "Dockerfile"
      - "nginx.conf"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kaayaka-games:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kaayaka-games:latest

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k-apps repo
        uses: actions/checkout@v4
        with:
          repository: NaveenSasalu/k-apps
          token: ${{ secrets.K_APPS_TOKEN }}

      - name: Update image tag in deployment manifest
        run: sed -i "s#kaayaka-games:.*#kaayaka-games:${{ github.sha }}#g" games/deploy.yaml

      - name: Commit updated manifest
        uses: EndBug/add-and-commit@v9
        with:
          add: "games/deploy.yaml"
          message: "ci: update kaayaka-games image to ${{ github.sha }}"
